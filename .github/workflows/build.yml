name: Build
on:
  push:
    branches: [master]
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake g++

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install and test with asdf
        run: |
          ASDF_VERSION=$(curl -fsSL https://api.github.com/repos/asdf-vm/asdf/releases/latest | grep tag_name | cut -d'"' -f4)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
          ASDF_ARCHIVE="asdf-${ASDF_VERSION}-${OS}-${ARCH}.tar.gz"
          mkdir -p $HOME/.asdf/bin
          curl -fsSL "https://github.com/asdf-vm/asdf/releases/download/${ASDF_VERSION}/${ASDF_ARCHIVE}" | tar -xz -C $HOME/.asdf/bin
          chmod +x $HOME/.asdf/bin/asdf
          export PATH="$HOME/.asdf/bin:$HOME/.asdf/shims:$PATH"
          asdf plugin add clingo $GITHUB_WORKSPACE
          asdf install clingo latest
          asdf set --home clingo latest
          clingo --version

  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bin
          severity: warning
